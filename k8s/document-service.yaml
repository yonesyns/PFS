apiVersion: apps/v1
kind: Deployment
metadata:
  name: document-service
  namespace: fleet-management
spec:
  replicas: 2
  selector:
    matchLabels:
      app: document-service
  template:
    metadata:
      labels:
        app: document-service
    spec:
      containers:
      - name: document-service
        image: fleet/document-service:latest
        ports:
        - containerPort: 8084
        env:
        - name: SPRING_PROFILES_ACTIVE
          value: "k8s"
        - name: EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE
          value: "http://eureka-server:8761/eureka"
        - name: SPRING_CONFIG_IMPORT
          value: "configserver:http://config-server:8888"
        - name: SPRING_KAFKA_BOOTSTRAP_SERVERS
          value: "kafka:9092"
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "1Gi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /actuator/health
            port: 8084
          initialDelaySeconds: 60
          periodSeconds: 30
        readinessProbe:
          httpGet:
            path: /actuator/health
            port: 8084
          initialDelaySeconds: 30
          periodSeconds: 10
        volumeMounts:
        - name: document-storage
          mountPath: /app/uploads
      volumes:
      - name: document-storage
        persistentVolumeClaim:
          claimName: document-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: document-service
  namespace: fleet-management
spec:
  selector:
    app: document-service
  ports:
  - port: 8084
    targetPort: 8084
  type: ClusterIP
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: document-pvc
  namespace: fleet-management
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi