server:
  port: 8083

spring:
  application:
    name: document-service
  data:
    mongodb:
      uri: mongodb://fleet_user:fleet_password@mongodb-document:27017/fleet_documents?authSource=admin
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  rabbitmq:
    host: rabbitmq
    port: 5672
    username: fleet_user
    password: fleet_password
    virtual-host: /
    listener:
      simple:
        acknowledge-mode: auto
        retry:
          enabled: true
          initial-interval: 1000
          multiplier: 2
          max-attempts: 3

fleet:
  rabbitmq:
    exchange: fleet.topic

minio:
  endpoint: http://minio:9000
  access-key: minioadmin
  secret-key: minioadmin
  bucket: fleet-documents

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

logging:
  level:
    com.fleet.document: DEBUG
    org.springframework.amqp: INFO

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
