# Redis Configuration for Fleet Management
bind 0.0.0.0
port 6379
protected-mode no

# Memory management
maxmemory 256mb
maxmemory-policy allkeys-lru

# Persistence
save 900 1
save 300 10
save 60 10000

# Logging
loglevel notice
logfile ""

# Performance
tcp-keepalive 300
timeout 0

# Security (for production, use proper authentication)
# requirepass your_password_here

# Monitoring
latency-monitor-threshold 100

# Rate limiting configuration
# Used by API Gateway for rate limiting