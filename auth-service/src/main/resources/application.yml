server:
  port: 8085

spring:
  application:
    name: auth-service
  datasource:
    url: jdbc:postgresql://postgres-auth:5432/fleet_auth
    username: fleet_user
    password: fleet_password
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    show-sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

fleet:
  security:
    jwt:
      secret: ${JWT_SECRET:fleet-management-dev-secret-key-change-me-please-32}
      expiration: ${JWT_EXPIRATION:86400000}
  auth:
    admin:
      email: ${AUTH_ADMIN_EMAIL:admin@fleet.local}
      password: ${AUTH_ADMIN_PASSWORD:Admin123!}
      first-name: ${AUTH_ADMIN_FIRST_NAME:Platform}
      last-name: ${AUTH_ADMIN_LAST_NAME:Admin}

management:
  health:
    rabbit:
      enabled: false
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

logging:
  level:
    com.fleet.auth: DEBUG

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
