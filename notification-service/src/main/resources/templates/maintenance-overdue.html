<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>⚠️ Maintenance En Retard</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f5f5f5; padding: 20px; }
        .container { max-width: 600px; margin: 0 auto; background: white; padding: 30px; border-radius: 8px; }
        .header { background: #f44336; color: white; padding: 20px; text-align: center; border-radius: 8px 8px 0 0; }
        .content { padding: 20px; }
        .alert-box { background: #ffebee; padding: 15px; border-left: 4px solid #f44336; margin: 15px 0; color: #c62828; }
        .footer { text-align: center; color: #666; font-size: 12px; margin-top: 30px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>⚠️ Maintenance EN RETARD</h1>
        </div>
        <div class="content">
            <p>Bonjour,</p>
            <p class="alert-box">
                <strong>ALERTE CRITIQUE :</strong> Une maintenance est en retard pour votre véhicule.
            </p>
            <p><span th:text="${notification.content}">Détails de la maintenance</span></p>
            <p><strong>Action requise :</strong> Contactez immédiatement votre garage pour planifier l'intervention.</p>
        </div>
        <div class="footer">
            <p>Fleet Management System</p>
        </div>
    </div>
</body>
</html>
