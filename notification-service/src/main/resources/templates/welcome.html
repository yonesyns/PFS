<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Bienvenue</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f5f5f5; padding: 20px; }
        .container { max-width: 600px; margin: 0 auto; background: white; padding: 30px; border-radius: 8px; }
        .header { background: #4CAF50; color: white; padding: 20px; text-align: center; border-radius: 8px 8px 0 0; }
        .content { padding: 20px; text-align: center; }
        .btn { display: inline-block; padding: 12px 24px; background: #4CAF50; color: white; text-decoration: none; border-radius: 4px; margin: 20px 0; }
        .footer { text-align: center; color: #666; font-size: 12px; margin-top: 30px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🎉 Bienvenue sur Fleet Management !</h1>
        </div>
        <div class="content">
            <p>Votre compte a été validé avec succès.</p>
            <p>Vous pouvez maintenant :</p>
            <ul style="text-align: left; display: inline-block;">
                <li>Gérer votre flotte de véhicules</li>
                <li>Suivre les maintenances</li>
                <li>Consulter vos factures</li>
            </ul>
            <br>
            <a href="#" class="btn">Accéder au tableau de bord</a>
        </div>
        <div class="footer">
            <p>Fleet Management System</p>
        </div>
    </div>
</body>
</html>
