<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Maintenance Planifiée</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f5f5f5; padding: 20px; }
        .container { max-width: 600px; margin: 0 auto; background: white; padding: 30px; border-radius: 8px; }
        .header { background: #2196F3; color: white; padding: 20px; text-align: center; border-radius: 8px 8px 0 0; }
        .content { padding: 20px; }
        .info-box { background: #e3f2fd; padding: 15px; border-left: 4px solid #2196F3; margin: 15px 0; }
        .footer { text-align: center; color: #666; font-size: 12px; margin-top: 30px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🔧 Maintenance Planifiée</h1>
        </div>
        <div class="content">
            <p>Bonjour,</p>
            <p>Une maintenance est planifiée pour votre véhicule :</p>
            <div class="info-box">
                <strong>Véhicule :</strong> <span th:text="${notification.content}">AB-123-CD</span><br>
                <strong>Date :</strong> <span th:text="${notification.createdAt}">2026-06-15</span>
            </div>
            <p>Veuillez prévoir le dépôt du véhicule à la date indiquée.</p>
        </div>
        <div class="footer">
            <p>Fleet Management System</p>
        </div>
    </div>
</body>
</html>
