server:
  port: 8085

spring:
  application:
    name: notification-service

  datasource:
    url: jdbc:postgresql://postgres-notification:5432/fleet_notification
    username: fleet_user
    password: fleet_password
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  spring:
    mail:
      host: ${MAIL_HOST:mailhog}
      port: ${MAIL_PORT:1025}
      username: ${MAIL_USERNAME:noreply@fleet.com}
      password: ${MAIL_PASSWORD:}
      properties:
        mail:
          smtp:
            auth: false
            starttls:
              enable: false

  rabbitmq:
    host: rabbitmq
    port: 5672
    username: fleet_user
    password: fleet_password

  thymeleaf:
    prefix: classpath:/templates/
    suffix: .html
    mode: HTML
    encoding: UTF-8
    cache: false

# RabbitMQ Config
fleet:
  rabbitmq:
    exchange: fleet.topic
    queue:
      vehicle: notification.vehicle.events
      customer: notification.customer.events
      payment: notification.payment.events

# Twilio (optionnel)
twilio:
  account:
    sid: ${TWILIO_ACCOUNT_SID:}
  auth:
    token: ${TWILIO_AUTH_TOKEN:}
  phone:
    number: ${TWILIO_PHONE_NUMBER:}

# Actuator
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always
  health:
    mail:
      enabled: false

# Logging
logging:
  level:
    com.fleet.notification: INFO
    org.springframework.amqp: WARN
