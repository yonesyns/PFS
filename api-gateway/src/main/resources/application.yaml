server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    config:
      enabled: false
    gateway:
      routes:
        - id: customer-route
          uri: lb://CUSTOMER-SERVICE
          predicates:
            - Path=/api/customers/**

        - id: vehicule-route
          uri: lb://VEHICULE-SERVICE
          predicates:
            - Path=/api/vehicules/**

        - id: payment-route
          uri: lb://PAYMENT-SERVICE
          predicates:
            - Path=/api/payments/**

        - id: document-route
          uri: lb://DOCUMENT-SERVICE
          predicates:
            - Path=/api/documents/**

      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins: "http://localhost:4200"
            allowedMethods: "*"
            allowedHeaders: "*"
            allowCredentials: true

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
